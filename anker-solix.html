<script type="text/html" data-help-name="anker-solix">
    <p>Liest Live- und Statistikdaten von <b>Anker SOLIX Solar- &amp; Speichersystemen</b> (Solarbank 2/3, Solarbank Max / Max AC, Power Dock AE100, Smart Meter) aus der EU-Cloud aus.</p>
    <h3>Ausgänge</h3>
    <ol>
        <li><b>Universal-Ausgang (<code>{ topic, payload }</code>):</b> Sendet nur bei Wertänderung an OpenCCU (<code>ccu-sysvar</code>), MQTT-Broker (<code>mqtt out</code>), InfluxDB oder KNX/Loxone.</li>
        <li><b>Cloud Rohdaten:</b> Vollständiges <code>scen_info</code>-Objekt zur freien Weiterverarbeitung.</li>
        <li><b>System / SITE_IDs:</b> Fehlermeldungen oder die Anlagenliste bei <code>msg.topic = "get_sites"</code>.</li>
    </ol>
    <h3>Steuerbefehle (Eingang)</h3>
    <ul>
        <li><code>msg.topic = "get_sites"</code>: Listet alle verfügbaren Anlagen (<code>SITE_ID</code>) an Ausgang 3 auf.</li>
        <li><code>msg.topic = "set_wakeup"</code> mit <code>true</code>, <code>false</code> oder <code>"auto"</code>: Schaltet den MQTT-Echtzeit-Wakeup manuell ein, aus oder zurück auf Automatik.</li>
    </ul>
</script>
