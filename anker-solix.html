<script type="text/html" data-help-name="anker-solix">
    <h3>Anker SOLIX OpenCCU – All-in-One Baustein</h3>
    <p>Dieser Baustein verbindet deine <b>Anker SOLIX Anlage</b> (Power Dock + bis zu 4 Solarbanks) direkt mit deinen <b>OpenCCU-Systemvariablen</b> – inklusive automatischem MQTT-Wakeup (alle 4 Minuten) und Cloud-schonender Statistik-Abfrage (Tag, Woche, Monat, Jahr).</p>

    <h4>1. Verkabelung im Flow</h4>
    <ul>
        <li><b>Eingang:</b> Mit einem <b>Inject-Node</b> verbinden (empfohlenes Intervall: alle <b>5 Sekunden</b>).</li>
        <li><b>Ausgang 1 (OpenCCU SysVars):</b> Direkt mit <b>einem einzigen blauen OpenCCU-SysVar-Node</b> verbinden. Im OpenCCU-Node muss das Feld <b>Variable/Name leer</b> bleiben, da der Variablenname automatisch über <code>msg.topic</code> übergeben wird.</li>
        <li><b>Ausgang 2 (Status):</b> Optionaler Ausgang für Status- und Debug-Meldungen.</li>
    </ul>

    <h4>2. Einrichtung & Konfiguration</h4>
    <ul>
        <li><b>Anker E-Mail & Passwort:</b> Zugangsdaten deines Anker-Hauptkontos eintragen (wird für volle Berechtigungen wie den MQTT-Wakeup und alle Statistikdaten benötigt; geteilte Gast-Accounts haben hier oft Einschränkungen).</li>
        <li><b>Mehrere Anlagen betreiben:</b> Du kannst den Baustein beliebig oft im Flow platzieren. Die Login-Sitzung (Token) wird pro <b>E-Mail-Adresse</b> getrennt verwaltet – laufen mehrere Anlagen über dasselbe Hauptkonto, teilen sie sich automatisch den Login, ohne sich gegenseitig abzumelden.</li>
        <li><b>Site ID:</b> Kann bei einer einzelnen Anlage leer bleiben – wird beim ersten Start automatisch aus der Anker-Cloud ermittelt und dauerhaft gespeichert. (Liegen mehrere Anlagen im selben Konto, hier die gewünschte Site ID eintragen.)</li>
        <li><b>Power Dock SN / PN:</b> Seriennummer und Produktcode (<code>AE100</code>) deines Power Docks für den automatischen 4-Minuten-Wakeup. Kann leer bleiben – wird automatisch aus der Anlage ausgelesen, sobald ein Power Dock erkannt wird.</li>
        <li><b>Solarbank 1 bis 4 SN:</b> Seriennummern deiner Speicher eintragen. Bleiben die Felder leer, werden bis zu vier vorhandene Solarbanks automatisch erkannt und gespeichert.</li>
        <li><b>SysVars Zuordnung (JSON):</b> Hinter dem jeweiligen Schlüssel den exakten Namen deiner OpenCCU-Systemvariable eintragen (z. B. <code>"PD_HAUSLAST": "Anker_Hauslast"</code>). Bei mehreren Bausteinen unbedingt unterschiedliche Variablennamen pro Anlage verwenden. Alle Felder, die leer (<code>""</code>) bleiben, werden übersprungen. Ein <code>rbe</code>-Filter (sendet nur bei Wertänderung) ist bereits integriert.</li>
    </ul>

    <h4>3. Verfügbare Datenpunkte & Einheiten</h4>
    <p><b>Power Dock / Gesamtanlage Live (Einheit: W bzw. %)</b></p>
    <ul>
        <li><code>PD_HAUSLAST</code>: Aktuelle Hauslast gesamt (W)</li>
        <li><code>PD_NETZ_BEZUG</code>: Aktueller Netzbezug vom Versorger (W)</li>
        <li><code>PD_NETZ_EINSP</code>: Aktuelle Netzeinspeisung (W)</li>
        <li><code>PD_SOC</code>: Gesamter Akkustand aller Speicher (%)</li>
        <li><code>PD_LADEN</code>: Aktuelle Gesamtladeleistung aller Akkus (W)</li>
        <li><code>PD_SOLAR</code>: Aktuelle Gesamtsolarleistung aller Speicher (W)</li>
        <li><code>PD_ENTLADEN</code>: Aktuelle Gesamtentladeleistung aller Akkus (W)</li>
    </ul>

    <p><b>Einzelne Solarbanks Live (SB1_ bis SB4_, Einheit: W bzw. %)</b></p>
    <ul>
        <li><code>SBx_SOC</code>: Akkustand der Solarbank (%)</li>
        <li><code>SBx_SOLAR</code>: Gesamte Solarleistung dieser Solarbank (W)</li>
        <li><code>SBx_LADEN</code>: Aktuelle Ladeleistung (W)</li>
        <li><code>SBx_OUTPUT</code>: Aktuelle Ausgangsleistung ins Haus/Powerdock (W)</li>
        <li><code>SBx_PV1</code> bis <code>SBx_PV4</code>: Leistung der einzelnen Solar-Eingänge 1 bis 4 (W)</li>
    </ul>

    <p><b>Statistik Gesamt & Einzel-Solarbanks (Einheit: kWh)</b></p>
    <p>Abruf alle <b>20 Minuten</b> (bei :01, :21, :41). Zeiträume: <code>TAG</code>, <code>WOCHE</code>, <code>MONAT</code>, <code>JAHR</code>.</p>
    <ul>
        <li><code>STAT_GES_&lt;ZEITRAUM&gt;_SOLAR</code>: Solarertrag gesamt (kWh)</li>
        <li><code>STAT_GES_&lt;ZEITRAUM&gt;_LADEN</code>: Batterie-Ladung gesamt (kWh)</li>
        <li><code>STAT_GES_&lt;ZEITRAUM&gt;_ENTLADEN</code>: Batterie-Entladung gesamt (kWh)</li>
        <li><code>STAT_GES_&lt;ZEITRAUM&gt;_SOLAR_HAUS</code>: Solar direkt ins Haus (kWh)</li>
        <li><code>STAT_GES_&lt;ZEITRAUM&gt;_EINSP</code>: Netzeinspeisung gesamt (kWh)</li>
        <li><code>STAT_GES_&lt;ZEITRAUM&gt;_NETZ</code>: Netzbezug vom Versorger (kWh)</li>
        <li><code>STAT_GES_&lt;ZEITRAUM&gt;_HAUS</code>: Gesamter Hausverbrauch (kWh)</li>
        <li><code>STAT_GES_&lt;ZEITRAUM&gt;_BAT_HAUS</code>: Batterie direkt ins Haus (kWh)</li>
        <li><code>STAT_SBx_&lt;ZEITRAUM&gt;_SOLAR</code>: Solarertrag der jeweiligen Solarbank SB1 bis SB4 (kWh)</li>
        <li><code>STAT_SBx_&lt;ZEITRAUM&gt;_LADEN</code>: Batterie-Ladung der jeweiligen Solarbank SB1 bis SB4 (kWh)</li>
        <li><code>STAT_SBx_&lt;ZEITRAUM&gt;_ENTLADEN</code>: Batterie-Entladung der jeweiligen Solarbank SB1 bis SB4 (kWh)</li>
    </ul>

    <h4>4. Hinweise für OpenCCU & CCU-Historian</h4>
    <ul>
        <li><b>Variablentyp in der OpenCCU:</b> Alle Systemvariablen als <b>Zahl (Gleitkommazahl)</b> anlegen und das Maximum hoch genug wählen (z. B. <code>999999</code> für Jahreswerte).</li>
        <li><b>CCU-Historian:</b> Statistik-Systemvariablen in der Historian-Datenpunkt-Konfiguration auf <b>Deaktiviert</b> setzen. Für Live-Werte empfiehlt sich in der <code>ccu-historian.config</code> der Wert <code>devices.device1.sysvarCycle=5000</code>.</li>
    </ul>
</script>
