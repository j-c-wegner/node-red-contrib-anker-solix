<script type="text/html" data-template-name="anker-solix">

<script type="text/html" data-help-name="anker-solix">
    <p>Reads real-time data (<code>W</code>, <code>%</code>, Smart Meter status) and energy statistics (<code>kWh</code>) from <b>Anker SOLIX Solar &amp; Energy Storage Systems</b> (Power Dock <code>AE100</code>, Solarbank 2, Solarbank 3 Pro <code>A17C5</code>, Solarbank 4 E5000 Pro <code>AE103</code>, Solarbank Max &amp; Smart Meters).</p>
    <ul>
        <li><b>Account:</b> Selects the central <code>anker-solix-config</code> account node used for HTTPS polling.</li>
        <li><b>Wakeup Account (optional):</b> Optional primary owner <code>anker-solix-config</code> node used solely for MQTT wake-up pings when reading via a secondary account.</li>
        <li><b>Output 1:</b> Emits <code>{ topic, payload }</code> on value change + 300s heartbeat (for OpenCCU <code>ccu-sysvar</code>, MQTT, InfluxDB, KNX/Loxone). Supports English keys (<code>SITE_*</code>, <code>SB1_*</code>, <code>STAT_*</code>) as well as all legacy <code>1.0.x</code> keys.</li>
        <li><b>Output 2:</b> Raw cloud JSON payloads (<code>scen_info</code> &amp; <code>energy_analysis</code>).</li>
        <li><b>Output 3:</b> System messages, Smart Meter online/offline alarms, errors, and <code>SITE_ID</code> discovery (<code>get_sites</code>).</li>
    </ul>
</script>
